# @mrzhaobh/dsh-composer-heal 的 bundle 层：插入它自己的 host 半边。
#
# name 用相对路径（锚定在本 patch 文件旁），从 git 装进 profile 的 node_modules
# 后依然可解析。浏览器半边由 index.js 的 dsh.client 声明自动挂到这一行上，
# 前提是 client.js 里 window.__ModuleLoader__.load({ id }) 的 id 与本包 package.json
# 的 name 完全一致——两者必须同步修改。
- insert:
    - id: composer-self-heal
      name: "./index.js"
