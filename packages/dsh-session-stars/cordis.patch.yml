# @mrzhaobh/dsh-session-stars 的 bundle 层：插入它自己的一行。
#
# 使用原生会话行的 trailing 槽位接入，识别到原生标题时在其前面挂载星标按钮。
#
# name 用相对路径（锚定在本 patch 文件旁），从 git 装进 profile 的 node_modules
# 后依然可解析。浏览器半边由 package.json 的 dsh.client 声明自动挂到这一行上，
# 前提是 client.js 里 load({ id }) 的 id 与包名完全一致。
- insert:
    - id: session-stars
      name: "./index.js"
