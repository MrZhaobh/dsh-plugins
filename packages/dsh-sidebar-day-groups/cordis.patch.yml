# @mrzhaobh/dsh-sidebar-day-groups 的 bundle 层：把会话区换成本包 vendor/ 里的实现。
#
# 为什么必须换掉内置那一行：会话区的「分组方式」菜单、日期分段、会话行上的星标
# 标记都在 @deepseek-ai/dsh-client-ui-workspace 的浏览器 bundle 内部，DSH 没有
# 提供可以从外部插入这些位置的 slot。所以这里沿用 DSH 自己的替换机制——禁用
# 内置行，再插入本包 vendor/ui-workspace/ 里的同名包副本。
#
# vendor/ui-workspace/package.json 的 name 必须保持上游包名
# @deepseek-ai/dsh-client-ui-workspace：dsh-client-modules 用「解析到的 manifest
# 包名」当浏览器模块 id，ui-sidebar / ui-chat / ui-conversation 都按这个 id 依赖
# 它；改成别的名字，这些插件就找不到模块、整个侧边栏不渲染（实测过）。
#
# name 用相对路径：DSH 的 patch 规范规定 insert 的相对路径锚定在 patch 文件旁，
# 所以从 git 装进 profile 的 node_modules 后依然能解析，换机器不用改这一行。
- id: ui-workspace
  disabled: true
- insert:
    - id: ui-workspace
      name: "./vendor/ui-workspace/index.js"
