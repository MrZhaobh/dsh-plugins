# @mrzhaobh/dsh-sidebar-day 的 bundle 层 —— 验证版。
#
# 关键：这里**不 disable 内置的 ui-workspace 行**。
# 目的是验证「内置行仍在运行时，另一个插件能否注册同一个 single 槽位
# sidebar.workspaces 并顶替它」。
#
#   - 能顶替 → 切换就可以做成「注册 / 注销」，按钮一点立即生效，无需重启
#   - 不能顶替（被忽略或冲突）→ 只能靠 loader 行级 disable/enable 切换
#
# 因为没禁用内置行，最坏结果是侧栏空白，而不是整页不可用。
- insert:
    - id: sidebar-day
      name: "./index.js"
